name: Export encrypted credentials backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-credentials-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'nikhilmenghani/NikGapps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create encrypted ZIP and commit to private backup repository
        env:
          AUTH: ${{ secrets.AUTH }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NIKGAPPS_CLIENT_ID: ${{ secrets.NIKGAPPS_CLIENT_ID }}
          NIKGAPPS_CLIENT_SECRET: ${{ secrets.NIKGAPPS_CLIENT_SECRET }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          CREDENTIAL_BACKUP_PASSWORD: ${{ secrets.CREDENTIAL_BACKUP_PASSWORD }}
        run: python3 .github/scripts/export_credentials_backup.py
